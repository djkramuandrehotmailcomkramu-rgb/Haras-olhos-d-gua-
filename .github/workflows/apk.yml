name: APK GPSThomas

# Gera o APK (casca Android em tela cheia que abre o gpsthomas.vercel.app) e o guarda em
# gpsthomas/public/GPSThomas.apk, para baixar em https://gpsthomas.vercel.app/GPSThomas.apk
on:
  workflow_dispatch:
  push:
    paths:
      - 'gpsthomas/casca/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gpsthomas/casca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Criar o projeto Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#0F4A27'
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION $M || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />#' $M
          grep uses-permission $M
      - name: Compilar o APK
        working-directory: gpsthomas/casca/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Guardar o APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ../public/GPSThomas.apk
          ls -l ../public/GPSThomas.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GPSThomas-apk
          path: gpsthomas/public/GPSThomas.apk
      - name: Enviar o APK para o repositório
        working-directory: .
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f gpsthomas/public/GPSThomas.apk
          git commit -m "APK GPSThomas (gerado pelo GitHub Actions) [skip ci]" || echo "sem mudanças"
          git push
