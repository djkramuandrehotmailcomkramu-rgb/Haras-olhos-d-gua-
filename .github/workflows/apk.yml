name: APK GPSThomas

# Gera o APK (casca Android em tela cheia que abre o gpsthomas.vercel.app) e o guarda em
# gpsthomas/public/GPSThomas.apk, para baixar em https://gpsthomas.vercel.app/GPSThomas.apk
on:
  workflow_dispatch:
  push:
    paths:
      - 'gpsthomas/casca/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gpsthomas/casca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Criar o projeto Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#0F4A27'
          npx cap sync android
          # Ponte de impressão: o site envia o HTML do plano e o Android abre a impressão do sistema
          JAVA_DIR=android/app/src/main/java/br/com/gpsthomas/app
          mkdir -p $JAVA_DIR
          cat > $JAVA_DIR/ImpressaoJs.java <<'JAVA'
          package br.com.gpsthomas.app;

          import android.app.Activity;
          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class ImpressaoJs {
            private static WebView segurando;
            private final Activity activity;

            public ImpressaoJs(Activity activity) { this.activity = activity; }

            @JavascriptInterface
            public void imprimirHtml(final String html, final String nome) {
              activity.runOnUiThread(new Runnable() {
                @Override public void run() {
                  final WebView wv = new WebView(activity);
                  segurando = wv;
                  wv.setWebViewClient(new WebViewClient() {
                    @Override public void onPageFinished(WebView view, String url) {
                      PrintManager pm = (PrintManager) activity.getSystemService(Context.PRINT_SERVICE);
                      PrintDocumentAdapter adaptador = view.createPrintDocumentAdapter(nome);
                      pm.print(nome, adaptador, new PrintAttributes.Builder().build());
                    }
                  });
                  wv.loadDataWithBaseURL("https://gpsthomas.vercel.app/", html, "text/html", "UTF-8", null);
                }
              });
            }
          }
          JAVA
          cat > $JAVA_DIR/ImpressaoPlugin.java <<'JAVA'
          package br.com.gpsthomas.app;

          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.util.Base64;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;

          @CapacitorPlugin(name = "Impressao")
          public class ImpressaoPlugin extends Plugin {
            private static WebView segurando;

            private void abrirImpressao(WebView wv, String nome) {
              PrintManager pm = (PrintManager) getActivity().getSystemService(Context.PRINT_SERVICE);
              PrintDocumentAdapter adaptador = wv.createPrintDocumentAdapter(nome);
              pm.print(nome, adaptador, new PrintAttributes.Builder().build());
            }

            /** Imprime a própria página do app (o site já deixou só o plano visível com @media print). */
            @PluginMethod
            public void imprimirPagina(final PluginCall call) {
              final String nome = call.getString("nome", "GPSThomas");
              getActivity().runOnUiThread(new Runnable() {
                @Override public void run() {
                  try {
                    abrirImpressao(getBridge().getWebView(), nome);
                    call.resolve();
                  } catch (Exception e) {
                    call.reject(String.valueOf(e));
                  }
                }
              });
            }

            /** Plano B: carrega o HTML num WebView fora da tela e imprime. */
            @PluginMethod
            public void imprimirHtml(final PluginCall call) {
              final String nome = call.getString("nome", "GPSThomas");
              final String html = call.getString("html", "");
              getActivity().runOnUiThread(new Runnable() {
                @Override public void run() {
                  try {
                    final WebView wv = new WebView(getActivity());
                    segurando = wv;
                    wv.setWebViewClient(new WebViewClient() {
                      @Override public void onPageFinished(WebView view, String url) {
                        try {
                          abrirImpressao(view, nome);
                          call.resolve();
                        } catch (Exception e) {
                          call.reject(String.valueOf(e));
                        }
                      }
                    });
                    wv.loadDataWithBaseURL("https://gpsthomas.vercel.app/", html, "text/html", "UTF-8", null);
                  } catch (Exception e) {
                    call.reject(String.valueOf(e));
                  }
                }
              });
            }

            /** Entrega um arquivo (PDF, backup, KML...) pela folha de compartilhar do Android. */
            @PluginMethod
            public void compartilhar(final PluginCall call) {
              try {
                String nome = call.getString("nome", "arquivo");
                String mime = call.getString("mime", "application/octet-stream");
                String b64 = call.getString("base64", "");
                byte[] bytes = Base64.decode(b64, Base64.DEFAULT);
                File dir = new File(getContext().getCacheDir(), "compartilhar");
                dir.mkdirs();
                File arq = new File(dir, nome.replaceAll("[^A-Za-z0-9._-]", "_"));
                FileOutputStream os = new FileOutputStream(arq);
                os.write(bytes);
                os.close();
                Uri uri = FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".fileprovider", arq);
                Intent envio = new Intent(Intent.ACTION_SEND);
                envio.setType(mime);
                envio.putExtra(Intent.EXTRA_STREAM, uri);
                envio.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                Intent escolha = Intent.createChooser(envio, nome);
                escolha.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                getActivity().startActivity(escolha);
                call.resolve();
              } catch (Exception e) {
                call.reject(String.valueOf(e));
              }
            }
          }
          JAVA
          cat > $JAVA_DIR/MainActivity.java <<'JAVA'
          package br.com.gpsthomas.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(ImpressaoPlugin.class);
              super.onCreate(savedInstanceState);
              getBridge().getWebView().addJavascriptInterface(new ImpressaoJs(this), "AndroidPrint");
            }
          }
          JAVA
          M=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION $M || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />#' $M
          grep uses-permission $M
      - name: Compilar o APK
        working-directory: gpsthomas/casca/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Guardar o APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ../public/GPSThomas.apk
          ls -l ../public/GPSThomas.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GPSThomas-apk
          path: gpsthomas/public/GPSThomas.apk
      - name: Enviar o APK para o repositório
        working-directory: .
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f gpsthomas/public/GPSThomas.apk
          git commit -m "APK GPSThomas (gerado pelo GitHub Actions) [skip ci]" || echo "sem mudanças"
          git push
