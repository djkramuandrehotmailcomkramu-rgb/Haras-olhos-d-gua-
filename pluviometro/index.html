<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pluviômetro</title>
<meta name="description" content="Coleta de pluviômetro por talhão: chuva acumulada, ranking e relatórios.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chuva">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="view"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="home" class="on">
    <svg viewBox="0 0 24 24"><path d="M12 3.2c-2.6 3.3-6 6.6-6 10.3a6 6 0 0 0 12 0c0-3.7-3.400-7-6-10.300Z"/></svg>
    <span>Início</span>
  </button>
  <button data-tab="map">
    <svg viewBox="0 0 24 24"><path d="M9 4 3.500 6v14L9 18l6 2 5.500-2V4L15 6 9 4Zm0 0v14m6-12v14"/></svg>
    <span>Mapa</span>
  </button>
  <button data-act="launch" class="plus" aria-label="Lançar leitura">
    <i><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></i>
  </button>
  <button data-tab="history">
    <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.010M4 12h.010M4 18h.010"/></svg>
    <span>Histórico</span>
  </button>
  <button data-tab="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.500v3M12 18.500v3M2.500 12h3M18.500 12h3M5.300 5.300l2.100 2.100M16.600 16.600l2.100 2.100M5.300 18.700l2.100-2.100M16.600 7.400l2.100-2.100"/></svg>
    <span>Ajustes</span>
  </button>
</nav>

<div id="sheets"></div>
<div id="toast" role="status"></div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script src="talhoes.js"></script>
<script src="app.js"></script>
</body>
</html>
