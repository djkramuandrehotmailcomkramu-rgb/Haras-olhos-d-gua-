<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pluviômetro</title>
<meta name="description" content="Coleta de pluviômetro por talhão: painel, chuva acumulada, ranking e relatórios.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chuva">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="view"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="home" class="on">
    <svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z"/></svg>
    <span>Painel</span>
  </button>
  <button data-tab="map">
    <svg viewBox="0 0 24 24"><path d="M9 4 3.500 6v14L9 18l6 2 5.500-2V4L15 6 9 4Zm0 0v14m6-12v14"/></svg>
    <span>Mapa</span>
  </button>
  <button data-act="launch" class="plus" aria-label="Lançar chuva">
    <i><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></i>
    <span>Lançar</span>
  </button>
  <button data-tab="history">
    <svg viewBox="0 0 24 24"><path d="M4 5h16v15H4V5Zm0 5h16M8 3v4m8-4v4"/></svg>
    <span>Histórico</span>
  </button>
  <button data-tab="more">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    <span>Mais</span>
  </button>
</nav>

<div id="sheets"></div>
<div id="toast" role="status"></div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script src="talhoes.js"></script>
<script src="coletas.js"></script>
<script src="app.js"></script>
</body>
</html>
