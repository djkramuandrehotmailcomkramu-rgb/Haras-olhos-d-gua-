    <style>html,body{background:#F1F4EF;overscroll-behavior:none;scroll-behavior:smooth}@media (prefers-color-scheme:dark){html,body{background:#0A110D}}body{-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}@font-face{font-family:'Inter_400Regular';src:url(/fonts/Inter_400Regular.woff2) format('woff2');font-display:swap}@font-face{font-family:'Inter_500Medium';src:url(/fonts/Inter_500Medium.woff2) format('woff2');font-display:swap}@font-face{font-family:'Inter_600SemiBold';src:url(/fonts/Inter_600SemiBold.woff2) format('woff2');font-display:swap}@font-face{font-family:'Inter_700Bold';src:url(/fonts/Inter_700Bold.woff2) format('woff2');font-display:swap}#gt-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#F1F4EF;font-family:Inter_700Bold,system-ui,sans-serif;color:#13201A;transition:opacity .25s}#gt-splash img{width:96px;height:96px;border-radius:22px}#gt-splash b{font-size:22px;letter-spacing:-.4px}@media (prefers-color-scheme:dark){#gt-splash{background:#0A110D;color:#EEF4EF}}</style>
    <script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').then(function(reg){window.__gtReg=reg;function avisa(){window.dispatchEvent(new CustomEvent('gt-nova-versao'))}if(reg.waiting&&navigator.serviceWorker.controller)avisa();reg.addEventListener('updatefound',function(){var nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',function(){if(nw.state==='installed'&&navigator.serviceWorker.controller)avisa()})});reg.update().catch(function(){});document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')reg.update().catch(function(){})})}).catch(function(){});var rec=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(rec||!window.__gtAtualizando)return;rec=true;location.reload()})})}</script>
